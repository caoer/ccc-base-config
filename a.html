const COLS = [
  { key: "profile", label: "profile" },
  { key: "role",    label: "role" },
  { key: "model",   label: "model in" },
  { key: "cwd",     label: "cwd" },
  { key: "arm",     label: "arm" },
  { key: "out",     label: "model out" },
  { key: "effort",  label: "effort" },
  { key: "prompt",  label: "prompt" },
  { key: "extras",  label: "extras" },
];

const KNOWN = new Set(["--model", "--effort", "--system-prompt-file", "--append-system-prompt-file"]);
const root = (DATA.root || "") + "/";
const shorten = (s) => (s || "").split(root).join("");

function flag(argv, name) {
  const i = argv.indexOf(name);
  if (i >= 0) return argv[i + 1] || "";
  const eq = argv.find((a) => a.startsWith(name + "="));
  return eq ? eq.slice(name.length + 1) : "";
}

const rows = DATA.rows.map((r) => {
  const extras = r.argv.filter((a, i) => !KNOWN.has(a) && !(i > 0 && KNOWN.has(r.argv[i - 1])));
  return {
    ...r,
    out: flag(r.argv, "--model"),
    effort: flag(r.argv, "--effort"),
    prompt: shorten(flag(r.argv, "--system-prompt-file")),
    extras: extras.map(shorten).join(" "),
    argvText: r.argv.map(shorten).join("\n"),
    key: r.argv.join("␀"),
    blob: [r.profile, r.role, r.model, r.cwd, r.arm, ...r.argv].map(shorten).join(" ").toLowerCase(),
  };
});

document.getElementById("meta").textContent =
  DATA.rows.length + " combinations · " + DATA.axes.profiles.length + " profiles × " +
  DATA.axes.roles.length + " roles × " + DATA.axes.models.length + " models × " +
  DATA.axes.cwds.length + " cwds · generated " + (DATA.generated || "").slice(0, 19).replace("T", " ");

function fillSelect(id, key) {
  const el = document.getElementById(id);
  const values = [...new Set(rows.map((r) => r[key]))].sort();
  el.innerHTML = '<option value="">all</option>' +
    values.map((v) => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v || "—") + "</option>").join("");
  el.onchange = draw;
}
["profile", "role", "arm"].forEach((k) => fillSelect("f-" + k, k));

document.getElementById("head").innerHTML = COLS.map((c) => "<th>" + c.label + "</th>").join("");

let open = null;

function draw() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fp = document.getElementById("f-profile").value;
  const fr = document.getElementById("f-role").value;
  const fa = document.getElementById("f-arm").value;
  const collapse = document.getElementById("collapse").checked;

  let out = rows.filter((r) =>
    (!q || r.blob.includes(q)) &&
    (!fp || r.profile === fp) &&
    (!fr || r.role === fr) &&
    (!fa || r.arm === fa));

  let note = out.length + " of " + rows.length + " rows";
  if (collapse) {
    const seen = new Map();
    for (const r of out) if (!seen.has(r.key)) seen.set(r.key, r);
    note = seen.size + " distinct launches (of " + out.length + " matching rows)";
    out = [...seen.values()];
  }
  document.getElementById("count").textContent = note;

  const body = document.getElementById("body");
  body.innerHTML = "";
  out.forEach((r, i) => {
    const tr = document.createElement("tr");
    tr.className = "row";
    tr.innerHTML = COLS.map((c) => {
      const v = r[c.key] || "";
      return '<td class="' + (v ? "" : "dim") + '">' + escapeHtml(v || "—") + "</td>";
    }).join("");
    tr.onclick = () => { open = open === r ? null : r; draw(); };
    body.appendChild(tr);
    if (open === r) {
      const d = document.createElement("tr");
      d.className = "detail";
      d.innerHTML = '<td colspan="' + COLS.length + '">' +
        '<div class="lbl">argv</div><code class="argv">' + escapeHtml(r.argvText) + "</code>" +
        '<div class="lbl">trace</div>' + escapeHtml(r.trace.map(shorten).join("\n")) +
        (r.warnings.length ? '<div class="lbl">warnings</div>' + escapeHtml(r.warnings.join("\n")) : "") +
        (r.candidates.length > 1 ? '<div class="lbl">arm candidates</div>' + escapeHtml(r.candidates.join(", ")) : "") +
        "</td>";
      body.appendChild(d);
    }
  });
}

// quotes included: these values also land in an attribute in fillSelect
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

document.getElementById("q").oninput = draw;
document.getElementById("collapse").onchange = draw;
document.getElementById("clear").onclick = () => {
  document.getElementById("q").value = "";
  ["f-profile", "f-role", "f-arm"].forEach((id) => (document.getElementById(id).value = ""));
  document.getElementById("collapse").checked = false;
  open = null;
  draw();
};
draw();
})();
</script>
