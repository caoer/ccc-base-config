# ccc-herdr.toml — pane-label rendering for the ccc fleet (the P2 painter).
# Owner: the ccc-herdr resident painter; ccc-statusd no longer renders herdr.
# Loop after an edit: `ccc-herdr check` (exit 1 on any diagnostic, prints the
# wire lines) → the painter hot-reloads on save; `ccc-herdr paint` forces now.
# Vars: SESSION_ID · SESSION_ID_SHORT · CCC_SESSION (session dir name, ad-hoc
# unjoined) · ROLE · TITLE (/rename) · NAME (TITLE→PROFILE fallback) · MODEL
# · PROFILE · PROFILE_IF_UNNAMED · HERDR_TITLE (pane OSC title, from herdr)
# · STATUS · CONTEXT_PERCENT · CONTEXT_TOKENS · COST · IDLE (time since last
# hook event, "5m"/"1h5m"/"2d3h"; empty under 1m). 80-char clamp per value.
# Translated 1:1 from the retired hooks.toml [herdr] table (2026-08-02).

[painter]
enabled = true                    # kill switch for BOTH writers (identity + AUQ)
method = "pane.report_metadata"   # herdr JSON-RPC method
agent = "claude"                  # herdr agent label on reports
ttl = "6h"                        # identity lease, duration STRING ("0" = live until replaced)
display_agent = "{{PROFILE}}"     # herdr display_agent field, template

[painter.tokens]                  # authoring this table REPLACES the whole default map
id = "{{SESSION_ID_SHORT}}"       # empty expansion = herdr clears that token
session = "{{CCC_SESSION}}"
role = "{{ROLE}}"
name = "{{TITLE}}"                # /rename title ONLY — cleared until the session is renamed
profile = "{{PROFILE_IF_UNNAMED}}" # ucc profile UNTIL a title exists, then cleared — never both
idle = "{{IDLE}}"                 # time since last hook event; empty (cleared) while active
# model = "{{MODEL}}"             # uncomment to add a model token
# Row layout (which tokens render where) is herdr-side:
# ~/.config/herdr/config.toml [ui.sidebar.agents.rows_by_agent]

[painter.params]                  # passthrough into params (strings template-expand)
# Navigator row label — HERDR_TITLE = the pane's Claude-set OSC title.
title = "{{CCC_SESSION}} {{NAME}}|{{HERDR_TITLE}}"

[auq]
blocked_label = "AUQ"             # label while an AskUserQuestion pends ("" = AUQ writer off)
lease = "20m"                     # blocked-label lease, renewed by the painter sweep
